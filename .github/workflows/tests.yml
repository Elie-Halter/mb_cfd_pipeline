name: tests

# Test suite without the solver and without patient data (tests/run_tests.sh).
# MMG (mmgs_O3) is not installed here: its test is skipped. The image-registration
# dependencies (itk-elastix, SimpleITK, pydicom) are not installed either: chain_image/
# imports them only inside the functions that need them.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System libraries (VTK off-screen rendering, gmsh wheel)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Shell syntax
        run: |
          for f in *.sh tools/*.sh benchmarks/*.sh tests/*.sh; do bash -n "$f"; done

      - name: Test suite
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
        run: xvfb-run -a bash tests/run_tests.sh
